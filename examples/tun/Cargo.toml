[package]
name = "yggdrasil-tun"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil leaf node bridged to an OS TUN interface (Linux / macOS)"
license = "MPL-2.0"
publish = false

[[bin]]
name = "yggdrasil-tun"
path = "src/main.rs"

[dependencies]
yggdrasil-lite = { path = "../.." }

ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rand = "0.8"
rand_core = "0.6"
hex = "0.4"

# TLS for the peer connection (auth is via Yggdrasil metadata, certs are ignored)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# TUN device (Linux + macOS)
tun = "0.7"
